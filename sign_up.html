<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodyple SignUp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="body">
        <div class="container">
            <div class="left-panel">
                <div class="logo">Bodyple</div>
                <div class="hero-content">
                    <h1>ITS TIME TO STAY <span>FIT,</span> no excuses</h1>
                </div>

            </div>

            <div class="right-panel">
                <div class="login-box">
                    <h2>Welcome to Bodyple!</h2>
                    <p>Please create your account</p>

                    <form>
                        <div id="mssg"></div>
                        <div class="input-group">
                            <input type="name" placeholder="Full name" required id="username">
                        </div>
                        <div class="input-group">
                            <input type="email" placeholder="Email" required id="SignUp_eml">
                        </div>
                        <div class="input-group">
                            <input type="password" placeholder="Password" required id="SignUp_pas">
                        </div>

                        <div class="options">
                            <label><input type="checkbox"> Remember Me</label>
                            <a href="#">Forgot Password?</a>
                        </div>

                        <button type="button" class="login-btn" onclick=SignUp()>Create an account</button>
                    </form>

                    <p class="signup-link"><a href="index.html">Already have an account?</a></p>
                    <div class="footer-text">© Copyright 2026 All Rights Reserved | Terms of Use</div>
                </div>
            </div>
        </div> 
    </div>
    <script src="sign_up.js"></script>
</body>

</html>
